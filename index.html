<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGarden - 专注花园</title>
    <style>
        :root {
            --bg-primary: #f5f0e8;
            --bg-secondary: #fff;
            --text-primary: #2c2c2c;
            --text-secondary: #666;
            --accent: #5a8f7b;
            --accent-light: #7eb3a0;
            --accent-dark: #3d6b5a;
            --shadow: rgba(0,0,0,0.1);
            --ink: #2d2d2d;
            --paper: #faf8f5;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent: #7eb3a0;
            --accent-light: #5a8f7b;
            --accent-dark: #8fcbb0;
            --shadow: rgba(0,0,0,0.3);
            --ink: #e0e0e0;
            --paper: #252525;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--paper);
            box-shadow: 0 0 50px var(--shadow);
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--shadow);
            background: var(--bg-secondary);
        }

        .header h1 {
            font-size: 28px;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .nav {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 20px;
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
        }

        .nav-btn:hover:not(.active) {
            color: var(--accent);
        }

        .page {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flower-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .flower-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .flower-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .flower-card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--bg-secondary), var(--accent-light), var(--bg-secondary));
        }

        .flower-card svg {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        .flower-card h3 {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .flower-card p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .timer-section {
            text-align: center;
            padding: 30px 0;
        }

        .timer-display {
            font-size: 72px;
            font-weight: 200;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--shadow);
        }

        .btn-secondary:hover {
            background: var(--shadow);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .time-presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .time-preset {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .time-preset:hover, .time-preset.active {
            background: var(--accent);
            color: white;
        }

        .growth-container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .growth-stage {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .growth-flower {
            width: 150px;
            height: 200px;
            margin: 0 auto;
            position: relative;
        }

        .growth-progress {
            margin-top: 20px;
        }

        .progress-bar {
            height: 8px;
            background: var(--shadow);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transition: width 0.5s;
            border-radius: 4px;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .garden-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .garden-slot {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--shadow);
            transition: all 0.3s;
        }

        .garden-slot.filled {
            border: 2px solid var(--accent-light);
            background: linear-gradient(135deg, var(--bg-secondary), var(--paper));
        }

        .garden-slot svg {
            width: 50px;
            height: 50px;
            opacity: 0.3;
        }

        .garden-slot.filled svg {
            opacity: 1;
        }

        .garden-slot span {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .garden-slot.filled span {
            color: var(--accent);
        }

        .stats-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .stats-card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .stats-card .value {
            font-size: 32px;
            color: var(--accent);
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .achievement-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .achievement-card.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .achievement-card.unlocked {
            border: 2px solid var(--accent);
        }

        .achievement-card svg {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }

        .achievement-card h4 {
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .achievement-card p {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .achievement-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }

        .encyclopedia-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .encyclopedia-item {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .encyclopedia-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .encyclopedia-item.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .encyclopedia-item svg {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .encyclopedia-item .info h4 {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .encyclopedia-item .info p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .encyclopedia-item .info .badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            font-size: 10px;
            margin-top: 5px;
        }

        .weather-widget {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-info svg {
            width: 50px;
            height: 50px;
        }

        .weather-info .temp {
            font-size: 24px;
            color: var(--accent);
        }

        .weather-info .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .city-input {
            padding: 8px 15px;
            border: 1px solid var(--shadow);
            border-radius: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
        }

        .settings-group {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .settings-group h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--shadow);
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .setting-item label {
            font-size: 14px;
            color: var(--text-primary);
        }

        .toggle {
            width: 50px;
            height: 26px;
            background: var(--shadow);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle.active {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 26px;
        }

        .sound-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .sound-btn {
            padding: 15px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--shadow);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: var(--text-primary);
        }

        .sound-btn:hover, .sound-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .sound-btn svg {
            width: 30px;
            height: 30px;
            margin-bottom: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-content .flower-result {
            width: 120px;
            height: 150px;
            margin: 20px auto;
        }

        .share-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .share-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .share-btn:hover {
            transform: scale(1.1);
        }

        .share-btn svg {
            width: 24px;
            height: 24px;
        }

        .noise-volume {
            width: 100%;
            margin-top: 10px;
        }

        .noise-volume input {
            width: 100%;
            accent-color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: var(--bg-primary);
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 2000;
            transition: all 0.3s;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .daily-goal {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .daily-goal h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .daily-goal .progress-ring {
            width: 120px;
            height: 120px;
            margin: 15px auto;
            position: relative;
        }

        .daily-goal .progress-ring svg {
            transform: rotate(-90deg);
        }

        .daily-goal .progress-ring circle {
            fill: none;
            stroke-width: 8;
        }

        .daily-goal .progress-ring .bg {
            stroke: rgba(255,255,255,0.2);
        }

        .daily-goal .progress-ring .progress {
            stroke: white;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s;
        }

        .daily-goal .progress-ring .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
        }

        .daily-goal p {
            font-size: 12px;
            opacity: 0.9;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 20px;
            z-index: 10;
        }

        .pause-overlay.active {
            display: flex;
        }

        .pause-overlay h3 {
            color: white;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .pause-overlay p {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>MindGarden</h1>
            <p>专注时光，静待花开</p>
        </header>

        <nav class="nav">
            <button class="nav-btn active" data-page="grow">种植</button>
            <button class="nav-btn" data-page="garden">花园</button>
            <button class="nav-btn" data-page="stats">统计</button>
            <button class="nav-btn" data-page="achievements">成就</button>
            <button class="nav-btn" data-page="settings">设置</button>
        </nav>

        <div id="page-grow" class="page active">
            <div class="weather-widget">
                <div class="weather-info">
                    <div id="weather-icon"></div>
                    <div>
                        <div class="temp" id="weather-temp">--°C</div>
                        <div class="desc" id="weather-desc">设置城市获取天气</div>
                    </div>
                </div>
                <input type="text" class="city-input" id="city-input" placeholder="输入城市">
            </div>

            <div class="flower-select" id="flower-select"></div>

            <div class="timer-section">
                <div class="time-presets">
                    <button class="time-preset" data-minutes="15">15分钟</button>
                    <button class="time-preset active" data-minutes="25">25分钟</button>
                    <button class="time-preset" data-minutes="45">45分钟</button>
                    <button class="time-preset" data-minutes="60">60分钟</button>
                </div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button class="btn btn-primary" id="start-btn">开始专注</button>
                    <button class="btn btn-secondary" id="pause-btn" style="display:none;">暂停</button>
                    <button class="btn btn-secondary" id="stop-btn" style="display:none;">停止</button>
                </div>
            </div>

            <div class="growth-container" id="growth-container" style="display:none;">
                <div class="growth-stage" id="growth-stage">种子期</div>
                <div class="growth-flower" id="growth-flower"></div>
                <div class="pause-overlay" id="pause-overlay">
                    <h3>已暂停</h3>
                    <p>点击继续开始计时</p>
                </div>
                <div class="growth-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
                    </div>
                    <p class="progress-text" id="progress-text">等待开始...</p>
                </div>
            </div>
        </div>

        <div id="page-garden" class="page">
            <div class="daily-goal">
                <h3>今日目标</h3>
                <div class="progress-ring">
                    <svg width="120" height="120">
                        <circle class="bg" cx="60" cy="60" r="52"></circle>
                        <circle class="progress" id="daily-progress-ring" cx="60" cy="60" r="52" 
                                stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
                    </svg>
                    <div class="text" id="daily-progress-text">0/3</div>
                </div>
                <p>今日完成 <span id="today-focus">0</span> 次专注 · 目标 3 次</p>
            </div>

            <h3 style="margin-bottom:15px;font-size:16px;">我的花园</h3>
            <div class="garden-grid" id="garden-grid"></div>

            <button class="btn btn-secondary" style="width:100%;margin-top:20px;" id="view-encyclopedia-btn">
                查看花百科
            </button>
        </div>

        <div id="page-stats" class="page">
            <div class="stats-grid">
                <div class="stats-card">
                    <h3>总专注时长</h3>
                    <div class="value" id="total-time">0</div>
                    <p style="font-size:12px;color:var(--text-secondary);">分钟</p>
                </div>
                <div class="stats-card">
                    <h3>培养花卉</h3>
                    <div class="value" id="total-flowers">0</div>
                    <p style="font-size:12px;color:var(--text-secondary);">株</p>
                </div>
                <div class="stats-card">
                    <h3>累计天数</h3>
                    <div class="value" id="total-days">0</div>
                    <p style="font-size:12px;color:var(--text-secondary);">天</p>
                </div>
                <div class="stats-card">
                    <h3>最长专注</h3>
                    <div class="value" id="longest-session">0</div>
                    <p style="font-size:12px;color:var(--text-secondary);">分钟</p>
                </div>
            </div>

            <div class="stats-card">
                <h3>本周专注趋势</h3>
                <div id="week-chart" style="height:150px;display:flex;align-items:flex-end;justify-content:space-between;padding-top:20px;">
                </div>
            </div>

            <div class="stats-card" style="margin-top:15px;">
                <h3>花卉分布</h3>
                <div id="flower-distribution" style="margin-top:15px;"></div>
            </div>
        </div>

        <div id="page-achievements" class="page">
            <div class="achievement-grid" id="achievement-grid"></div>
        </div>

        <div id="page-settings" class="page">
            <div class="settings-group">
                <h3>外观</h3>
                <div class="setting-item">
                    <label>暗色模式</label>
                    <div class="toggle" id="dark-mode-toggle"></div>
                </div>
            </div>

            <div class="settings-group">
                <h3>白噪音</h3>
                <div class="sound-btns">
                    <div class="sound-btn" data-sound="rain">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                state = { ...state, ...parsed };

                    ${FLOWER_SVGS[flower.id][state.garden.includes(flower.id) ? 'flourish' : 'bloom']}
                    <h3>${flower.name}</h3>
                    <p>${flower.desc}</p>
                </div>
            `).join('');
        }

        function renderGarden() {
            const container = document.getElementById('garden-grid');
            const slots = [];
            for (let i = 0; i < 9; i++) {
                const flower = state.garden[i];
                if (flower) {
                    const flowerData = FLOWERS.find(f => f.id === flower);
                    slots.push(`
                        <div class="garden-slot filled">
                            ${FLOWER_SVGS[flower][state.garden.includes(flower) ? 'flourish' : 'bloom']}
                            <span>${flowerData.name}</span>
                        </div>
                    `);
                } else {
                    slots.push(`
                        <div class="garden-slot">
                            <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="15" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3"/></svg>
                            <span>空位</span>
                        </div>
                    `);
                }
            }
            container.innerHTML = slots.join('');
        }

        function renderAchievements() {
            const container = document.getElementById('achievement-grid');
            container.innerHTML = ACHIEVEMENTS.map(ach => {
                const unlocked = state.achievements.includes(ach.id);
                return `
                    <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-badge">${unlocked ? '✓' : '?'}</div>
                        <div style="font-size:30px;margin-bottom:10px;">${ach.icon}</div>
                        <h4>${ach.name}</h4>
                        <p>${ach.desc}</p>
                    </div>
                `;
            }).join('');
        }

        function renderStats() {
            document.getElementById('total-time').textContent = state.stats.totalTime;
            document.getElementById('total-flowers').textContent = state.stats.totalFlowers;
            document.getElementById('total-days').textContent = state.stats.totalDays;
            document.getElementById('longest-session').textContent = state.stats.longestSession;
            document.getElementById('today-focus').textContent = state.todaySessions;

            const progress = state.todaySessions / state.dailyGoal;
            const circumference = 2 * Math.PI * 52;
            document.getElementById('daily-progress-ring').style.strokeDashoffset = circumference * (1 - Math.min(progress, 1));
            document.getElementById('daily-progress-text').textContent = `${state.todaySessions}/${state.dailyGoal}`;

            renderWeekChart();
            renderFlowerDistribution();
        }

        function renderWeekChart() {
            const container = document.getElementById('week-chart');
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const today = new Date();
            let bars = '';
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const minutes = state.stats.sessionsPerDay[dateStr] || 0;
                const height = Math.min(minutes / 60 * 100, 100);
                bars += `
                    <div style="flex:1;text-align:center;">
                        <div style="height:${Math.max(height, 5)}px;background:var(--accent);border-radius:4px 4px 0 0;margin:0 5px;"></div>
                        <div style="font-size:10px;color:var(--text-secondary);margin-top:5px;">${days[date.getDay()]}</div>
                    </div>
                `;
            }
            container.innerHTML = bars;
        }

        function renderFlowerDistribution() {
            const container = document.getElementById('flower-distribution');
            const types = Object.entries(state.stats.flowerTypes);
            if (types.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">暂无数据</p>';
                return;
            }
            container.innerHTML = types.map(([flowerId, count]) => {
                const flower = FLOWERS.find(f => f.id === flowerId);
                const percent = Math.round(count / state.stats.totalFlowers * 100);
                return `
                    <div style="display:flex;align-items:center;margin-bottom:10px;">
                        <div style="width:60px;font-size:12px;">${flower.name}</div>
                        <div style="flex:1;height:8px;background:var(--shadow);border-radius:4px;overflow:hidden;">
                            <div style="width:${percent}%;height:100%;background:var(--accent);"></div>
                        </div>
                        <div style="width:40px;text-align:right;font-size:12px;color:var(--text-secondary);">${percent}%</div>
                    </div>
                `;
            }).join('');
        }

        function setupEventListeners() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
                });
            });

            document.getElementById('flower-select').addEventListener('click', (e) => {
                const card = e.target.closest('.flower-card');
                if (card) {
                    state.selectedFlower = card.dataset.flower;
                    renderFlowerSelect();
                }
            });

            document.querySelectorAll('.time-preset').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.time-preset').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.focusDuration = parseInt(btn.dataset.minutes);
                    state.remainingTime = state.focusDuration * 60;
                    updateTimerDisplay();
                });
            });

            document.getElementById('start-btn').addEventListener('click', startTimer);
            document.getElementById('pause-btn').addEventListener('click', togglePause);
            document.getElementById('stop-btn').addEventListener('click', stopTimer);

            document.getElementById('pause-overlay').addEventListener('click', () => {
                if (state.isPaused) togglePause();
            });

            document.getElementById('city-input').addEventListener('change', (e) => {
                state.city = e.target.value;
                fetchWeather();
                saveState();
            });

            document.getElementById('dark-mode-toggle').addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                applyDarkMode();
                saveState();
            });

            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sound = btn.dataset.sound;
                    if (state.currentSound === sound) {
                        stopSound();
                    } else {
                        playSound(sound);
                    }
                });
            });

            document.getElementById('volume-slider').addEventListener('input', (e) => {
                if (state.noiseGain) {
                    state.noiseGain.gain.value = e.target.value / 100;
                }
            });

            document.getElementById('view-encyclopedia-btn').addEventListener('click', showEncyclopedia);
            document.getElementById('close-encyclopedia-btn').addEventListener('click', () => {
                document.getElementById('encyclopedia-modal').classList.remove('active');
            });

            document.getElementById('add-to-garden-btn').addEventListener('click', addCurrentFlowerToGarden);
            document.getElementById('share-wechat').addEventListener('click', shareToWechat);
            document.getElementById('share-twitter').addEventListener('click', shareToTwitter);

            document.getElementById('export-data-btn').addEventListener('click', exportData);
            document.getElementById('clear-data-btn').addEventListener('click', clearAllData);

            document.getElementById('notification-toggle').addEventListener('click', function() {
                this.classList.toggle('active');
                if (this.classList.contains('active')) {
                    Notification.requestPermission();
                }
            });
        }

        function startTimer() {
            if (!state.selectedFlower) {
                showToast('请先选择一株花卉');
                return;
            }

            if (state.garden.length >= 9 && !state.garden.includes(state.selectedFlower)) {
                showToast('花园已满！');
                return;
            }

            state.isRunning = true;
            state.isPaused = false;
            state.currentStage = 0;
            state.growthProgress = 0;

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('growth-container').style.display = 'block';

            updateGrowthDisplay();

            const weatherBonus = getWeatherBonus();
            const interval = 1000 / weatherBonus;

            state.timer = setInterval(() => {
                if (!state.isPaused) {
                    state.remainingTime--;
                    updateTimerDisplay();
                    updateGrowth();

                    if (state.remainingTime <= 0) {
                        completeSession();
                    }
                }
            }, interval);
        }

        function togglePause() {
            state.isPaused = !state.isPaused;
            document.getElementById('pause-btn').textContent = state.isPaused ? '继续' : '暂停';
            document.getElementById('pause-overlay').classList.toggle('active', state.isPaused);
        }

        function stopTimer() {
            clearInterval(state.timer);
            state.isRunning = false;
            state.isPaused = false;
            state.remainingTime = state.focusDuration * 60;
            state.currentStage = 0;
            state.growthProgress = 0;

            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('pause-overlay').classList.remove('active');
            document.getElementById('pause-btn').textContent = '暂停';
            document.getElementById('growth-container').style.display = 'none';

            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(state.remainingTime / 60);
            const seconds = state.remainingTime % 60;
            document.getElementById('timer-display').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateGrowth() {
            const totalSeconds = state.focusDuration * 60;
            const elapsed = totalSeconds - state.remainingTime;
            const progress = elapsed / totalSeconds;

            const newStage = Math.min(Math.floor(progress * 6), 5);
            if (newStage !== state.currentStage) {
                state.currentStage = newStage;
            }
            state.growthProgress = progress;

            updateGrowthDisplay();
        }

        function updateGrowthDisplay() {
            const stage = STAGES[state.currentStage];
            document.getElementById('growth-stage').textContent = stage.name;

            const flowerSvg = FLOWER_SVGS[state.selectedFlower][stage.icon];
            document.getElementById('growth-flower').innerHTML = flowerSvg;

            const percent = Math.round(state.growthProgress * 100);
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `生长进度 ${percent}%`;
        }

        function completeSession() {
            clearInterval(state.timer);
            state.isRunning = false;

            const today = new Date().toISOString().split('T')[0];
            state.stats.totalTime += state.focusDuration;
            state.stats.totalFlowers++;
            state.stats.longestSession = Math.max(state.stats.longestSession, state.focusDuration);
            state.stats.sessionsPerDay[today] = (state.stats.sessionsPerDay[today] || 0) + state.focusDuration;
            state.stats.flowerTypes[state.selectedFlower] = (state.stats.flowerTypes[state.selectedFlower] || 0) + 1;

            if (!state.stats.sessionsPerDay[today] || Object.keys(state.stats.sessionsPerDay).length === 1) {
                state.stats.totalDays++;
            }

            state.todaySessions++;

            checkAchievements();
            saveState();

            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'none';

            showBloomModal();
        }

        function showBloomModal() {
            const flower = FLOWERS.find(f => f.id === state.selectedFlower);
            document.getElementById('bloom-message').textContent = `恭喜你完成了 ${state.focusDuration} 分钟的专注时光，${flower.name} 开花啦！`;
            document.getElementById('bloom-flower').innerHTML = FLOWER_SVGS[state.selectedFlower]['flourish'];
            document.getElementById('bloom-modal').classList.add('active');

            if (Notification.permission === 'granted') {
                new Notification('MindGarden', {
                    body: `${flower.name} 开花啦！`,
                    icon: '🌸'
                });
            }
        }

        function addCurrentFlowerToGarden() {
            if (state.garden.length < 9 && !state.garden.includes(state.selectedFlower)) {
                state.garden.push(state.selectedFlower);
                renderGarden();
                saveState();
            }
            document.getElementById('bloom-modal').classList.remove('active');
            checkAchievements();
        }

        function showEncyclopedia() {
            const list = document.getElementById('encyclopedia-list');
            list.innerHTML = FLOWERS.map(flower => {
                const unlocked = state.garden.includes(flower.id);
                return `
                    <div class="encyclopedia-item ${unlocked ? '' : 'locked'}">
                        ${FLOWER_SVGS[flower.id]['flourish']}
                        <div class="info">
                            <h4>${flower.name}</h4>
                            <p>${flower.meaning}</p>
                            ${unlocked ? '<span class="badge">已培育</span>' : '<span class="badge" style="background:var(--text-secondary);">未培育</span>'}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('encyclopedia-modal').classList.add('active');
        }

        function shareToWechat() {
            const flower = FLOWERS.find(f => f.id === state.selectedFlower);
            const text = `我在 MindGarden 完成了 ${state.focusDuration} 分钟的专注，培养出了 ${flower.name}！🌸`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            }
        }

        function shareToTwitter() {
            const flower = FLOWERS.find(f => f.id === state.selectedFlower);
            const text = `I completed ${state.focusDuration} minutes of focused time on MindGarden and grew a beautiful ${flower.name}! 🌸 #MindGarden #FocusTime`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
        }

        function getWeatherBonus() {
            if (!state.weather) return 1;
            const code = state.weather;
            if (code.includes('sun') || code.includes('clear')) return 1.2;
            if (code.includes('rain')) return 0.8;
            if (code.includes('cloud')) return 1;
            if (code.includes('thunder')) return 0.7;
            if (code.includes('snow')) return 0.6;
            return 1;
        }

        async function fetchWeather() {
            if (!state.city) return;
            try {
                const apiKey = '4d8fb5b93d4af21d66d1a5e8b3c8f8e2';
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(state.city)}&appid=${apiKey}&units=metric`);
                const data = await response.json();
                if (data.weather && data.weather[0]) {
                    const icon = data.weather[0].icon;
                    state.weather = WEATHER_CODES[icon] || 'cloudy';
                    document.getElementById('weather-icon').innerHTML = WEATHER_SVGS[state.weather] || WEATHER_SVGS['cloudy'];
                    document.getElementById('weather-temp').textContent = `${Math.round(data.main.temp)}°C`;
                    document.getElementById('weather-desc').textContent = data.weather[0].description;
                }
            } catch (err) {
                console.log('天气获取失败');
            }
        }

        function playSound(type) {
            stopSound();
            state.currentSound = type;

            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sound === type);
            });
            document.getElementById('noise-volume').style.display = 'block';

            if (!state.audioContext) {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            state.noiseGain = state.audioContext.createGain();
            state.noiseGain.gain.value = 0.5;
            state.noiseGain.connect(state.audioContext.destination);

            const bufferSize = 4096;
            const noise = state.audioContext.createScriptProcessor(bufferSize, 1, 1);

            if (type === 'rain') {
                noise.onrandomnumber = Math.random() * 2 - 1;
                noise.onaudioprocess = (e) => {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                };
            } else if (type === 'forest') {
                noise.onaudioprocess = (e) => {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = (Math.random() + Math.sin(Date.now() / 1000) * 0.3) * 0.5;
                    }
                };
            } else if (type === 'ocean') {
                let phase = 0;
                noise.onaudioprocess = (e) => {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        phase += 0.001;
                        output[i] = Math.sin(phase * 2) * Math.random() * 0.8;
                    }
                };
            }

            noise.connect(state.noiseGain);
            state.currentNoise = noise;
        }

        function stopSound() {
            if (state.currentNoise) {
                state.currentNoise.disconnect();
                state.currentNoise = null;
            }
            state.currentSound = null;
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('noise-volume').style.display = 'none';
        }

        function checkDailyGoal() {
            const today = new Date().toISOString().split('T')[0];
            const lastSession = Object.keys(state.stats.sessionsPerDay).sort().pop();
            if (lastSession !== today) {
                state.todaySessions = 0;
            } else {
                state.todaySessions = Object.values(state.stats.sessionsPerDay).reduce((a, b) => a + b, 0) / 25;
            }
        }

        function checkAchievements() {
            ACHIEVEMENTS.forEach(ach => {
                if (!state.achievements.includes(ach.id) && ach.condition(state.stats)) {
                    state.achievements.push(ach.id);
                    showToast(`🏆 成就解锁: ${ach.name}`);
                }
            });
            renderAchievements();
        }

        function applyDarkMode() {
            document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
            document.getElementById('dark-mode-toggle').classList.toggle('active', state.darkMode);
        }

        function exportData() {
            const data = JSON.stringify(state, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mindgarden_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        }

        function clearAllData() {
            if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
                localStorage.removeItem('mindgarden_state');
                location.reload();
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        init();
    </script>
</body>
</html>
